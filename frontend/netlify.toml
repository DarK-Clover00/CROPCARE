[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://everyday-got-circuits-theater.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/notification"
  to = "https://everyday-got-circuits-theater.trycloudflare.com/notification"
  status = 200
  force = true

[[redirects]]
  from = "/video/*"
  to = "https://everyday-got-circuits-theater.trycloudflare.com/video/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
