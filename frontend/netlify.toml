[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://cropcare-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/notification"
  to = "https://cropcare-api.onrender.com/notification"
  status = 200
  force = true

[[redirects]]
  from = "/video/*"
  to = "https://cropcare-api.onrender.com/video/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
